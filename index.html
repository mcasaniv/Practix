<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Practix</title>
    <meta name="description" content="Una plataforma académica integral para la gestión de bancos de preguntas, organización de temas y simulacros de evaluación con retroalimentación inmediata." />
    <meta property="og:title" content="Practix" />
    <meta property="og:description" content="Una plataforma académica integral para la gestión de bancos de preguntas, organización de temas y simulacros de evaluación con retroalimentación inmediata." />
    <meta name="theme-color" content="#4338ca" />
    <link rel="icon" type="image/png" href="Practix logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/contrib/auto-render.min.js"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      html, body {
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
        overflow-x: clip;
        max-width: 100vw;
        width: 100%;
      }
      .overflow-x-clip {
        overflow-x: clip;
      }
      /* Safe area insets for mobile notched devices */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0.75rem);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      button, a, input, select {
        touch-action: manipulation;
      }
      body, div, header, nav, main, footer, section, article, aside, h1, h2, h3, h4, h5, h6, p, span, a, button, input, select, textarea, label {
        transition-property: background-color, border-color, color, fill, stroke, box-shadow;
        transition-duration: 300ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      html.dark {
        color-scheme: dark;
      }
      html:not(.dark) {
        color-scheme: light;
      }
      body {
        font-family: 'Inter', sans-serif;
        color: #0f172a;
      }
      .dark body,
      html.dark body {
        background-color: #020617; /* slate-950 */
        color: #f8fafc; /* slate-50 */
      }
      body:not(.dark),
      html:not(.dark) body {
        background-color: #f9fafb; /* gray-50 */
        color: #0f172a; /* slate-900 */
      }

      /* Native select, option, input, and textarea dark mode styling */
      html.dark select,
      html.dark input:not([type="checkbox"]):not([type="radio"]),
      html.dark textarea {
        color-scheme: dark;
        color: #f8fafc;
      }
      html.dark select option,
      html.dark select optgroup {
        background-color: #0f172a !important;
        color: #f8fafc !important;
      }
      html:not(.dark) select option,
      html:not(.dark) select optgroup {
        background-color: #ffffff !important;
        color: #0f172a !important;
      }

      /* In dark mode, ensure text with fixed light-theme gray colors properly inverts */
      .dark .text-gray-900:not([class*="dark:text-"]):not(button.bg-white *):not(.bg-white *) { color: #f8fafc !important; }
      .dark .text-gray-800:not([class*="dark:text-"]):not(button.bg-white *):not(.bg-white *) { color: #f1f5f9 !important; }
      .dark .text-gray-700:not([class*="dark:text-"]):not(button.bg-white *):not(.bg-white *) { color: #e2e8f0 !important; }
      .dark .text-gray-600:not([class*="dark:text-"]):not(button.bg-white *):not(.bg-white *) { color: #cbd5e1 !important; }
      .dark .text-slate-900:not([class*="dark:text-"]):not(button.bg-white *):not(.bg-white *) { color: #f8fafc !important; }
      .dark .text-slate-800:not([class*="dark:text-"]):not(button.bg-white *):not(.bg-white *) { color: #f1f5f9 !important; }
      .dark .text-slate-700:not([class*="dark:text-"]):not(button.bg-white *):not(.bg-white *) { color: #e2e8f0 !important; }
      .dark .text-indigo-950:not([class*="dark:text-"]):not(button.bg-white *):not(.bg-white *) { color: #e0e7ff !important; }
      .dark .text-indigo-900:not([class*="dark:text-"]):not(button.bg-white *):not(.bg-white *) { color: #e0e7ff !important; }

      /* Underlined words in questions, statements, and options: clean underline without heavy highlighting */
      u,
      ins,
      .practix-underlined-text {
        text-decoration: underline !important;
        text-decoration-thickness: 2px !important;
        text-underline-offset: 3.5px !important;
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        text-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        display: inline !important;
        color: inherit !important;
        text-decoration-color: currentColor !important;
      }

      button u,
      button ins,
      button .practix-underlined-text {
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        display: inline !important;
        color: inherit !important;
        text-decoration: underline !important;
        text-decoration-thickness: 2px !important;
        text-underline-offset: 3.5px !important;
        text-decoration-color: currentColor !important;
      }

      /* KaTeX math formulas containing \overline, \underline, \frac */
      .katex .katex-overline .overline-line,
      .katex .overline .overline-line {
        border-bottom-style: solid !important;
        border-bottom-color: currentColor !important;
        display: inline-block !important;
        width: 100% !important;
        min-height: 1px !important;
      }
      .katex .katex-underline .underline-line,
      .katex .underline .underline-line {
        border-bottom-style: solid !important;
        border-bottom-color: currentColor !important;
        display: inline-block !important;
        width: 100% !important;
        min-height: 1px !important;
      }
      .katex .mfrac .frac-line {
        border-bottom-style: solid !important;
        border-bottom-color: currentColor !important;
        display: inline-block !important;
        width: 100% !important;
        min-height: 1px !important;
      }
      .katex .underline,
      .katex-html .underline {
        border-bottom: 2px solid currentColor !important;
        background-color: transparent !important;
        padding: 0 !important;
      }

      /* KaTeX sizing and line layout in cards & quiz buttons */
      .katex {
        font-size: 1.05em;
        line-height: normal;
        text-rendering: auto;
      }
      .katex-html {
        white-space: normal;
      }

      /* 3D Flip Card Styles */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }

      /* PDF & Print Styles */
      @media print {
        html, html.dark, body, html.dark body {
          background-color: #ffffff !important;
          background: #ffffff !important;
          color: #000000 !important;
          margin: 0 !important;
          padding: 0 !important;
          height: auto !important;
          min-height: 100% !important;
          overflow: visible !important;
        }

        /* Hide all background app elements */
        body * {
          visibility: hidden;
        }

        /* Reveal ONLY the printable document container and its elements */
        .printable-exam-container,
        .printable-exam-container * {
          visibility: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .no-print-wrapper {
          position: static !important;
          left: auto !important;
          top: auto !important;
          width: 100% !important;
          height: auto !important;
          background: transparent !important;
          overflow: visible !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        .no-print-wrapper > div:first-child,
        .no-print,
        nav,
        header,
        footer,
        button {
          display: none !important;
          visibility: hidden !important;
        }

        .no-print-wrapper > div:last-child {
          background: transparent !important;
          padding: 0 !important;
          margin: 0 !important;
          min-height: 0 !important;
        }

        .printable-exam-container {
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 4mm !important;
          background: #ffffff !important;
          color: #0f172a !important;
          box-shadow: none !important;
          border: none !important;
          border-radius: 0 !important;
        }

        .break-inside-avoid {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }

        @page {
          margin: 12mm 15mm 15mm 15mm;
          size: A4 portrait;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
