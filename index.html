<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Practix</title>
    <meta name="description" content="Una plataforma académica integral para la gestión de bancos de preguntas, organización de temas y simulacros de evaluación con retroalimentación inmediata." />
    <meta property="og:title" content="Practix" />
    <meta property="og:description" content="Una plataforma académica integral para la gestión de bancos de preguntas, organización de temas y simulacros de evaluación con retroalimentación inmediata." />
    <meta name="theme-color" content="#4338ca" />
    <link rel="icon" type="image/png" href="Practix logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      html, body {
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        max-width: 100vw;
        width: 100%;
      }
      /* Safe area insets for mobile notched devices */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0.75rem);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      button, a, input, select {
        touch-action: manipulation;
      }
      body, div, header, nav, main, footer, section, article, aside, h1, h2, h3, h4, h5, h6, p, span, a, button, input, select, textarea, label {
        transition-property: background-color, border-color, color, fill, stroke, box-shadow;
        transition-duration: 300ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      .dark body {
        background-color: #020617; /* slate-950 */
      }
      body:not(.dark) {
        background-color: #f9fafb; /* gray-50 */
      }
      /* KaTeX tweaks */
      .katex-display {
        margin: 1em 0;
        overflow-x: auto;
        overflow-y: hidden;
      }

      /* 3D Flip Card Styles */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }

      /* PDF & Print Styles */
      @media print {
        html, html.dark, body, html.dark body {
          background-color: #ffffff !important;
          background: #ffffff !important;
          color: #000000 !important;
          margin: 0 !important;
          padding: 0 !important;
          height: auto !important;
          min-height: 100% !important;
          overflow: visible !important;
        }

        /* Hide all background app elements */
        body * {
          visibility: hidden;
        }

        /* Reveal ONLY the printable document container and its elements */
        .printable-exam-container,
        .printable-exam-container * {
          visibility: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .no-print-wrapper {
          position: static !important;
          left: auto !important;
          top: auto !important;
          width: 100% !important;
          height: auto !important;
          background: transparent !important;
          overflow: visible !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        .no-print-wrapper > div:first-child,
        .no-print,
        nav,
        header,
        footer,
        button {
          display: none !important;
          visibility: hidden !important;
        }

        .no-print-wrapper > div:last-child {
          background: transparent !important;
          padding: 0 !important;
          margin: 0 !important;
          min-height: 0 !important;
        }

        .printable-exam-container {
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 4mm !important;
          background: #ffffff !important;
          color: #0f172a !important;
          box-shadow: none !important;
          border: none !important;
          border-radius: 0 !important;
        }

        .break-inside-avoid {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }

        @page {
          margin: 12mm 15mm 15mm 15mm;
          size: A4 portrait;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

</body>
</html>
